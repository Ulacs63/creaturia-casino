<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Créaturia Casino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0918;--bg2:#141029;--panel:#1b1535;--panel2:#241c46;--line:#3a2f6b;
  --txt:#efeaff;--mute:#a59cc9;--gold:#f5c451;--gold2:#ffe39a;
  --feu:#ff6b3d;--eau:#3da5ff;--terre:#5fcf6a;--air:#8fe3dc;--foudre:#ffd23d;
  --win:#4ade80;--lose:#ff5c7a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Nunito,system-ui,sans-serif}
body{min-height:100vh;background:
  radial-gradient(1200px 500px at 50% -200px,#3b2580 0%,transparent 60%),
  radial-gradient(600px 400px at 100% 100%,#1d3a6b55 0%,transparent 70%),var(--bg);
  background-attachment:fixed;padding-bottom:84px}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
input,select{font-family:inherit;font-size:16px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}

/* Header */
header{position:sticky;top:0;z-index:20;background:linear-gradient(#0c0918f2,#0c0918d9);backdrop-filter:blur(8px);border-bottom:1px solid #ffffff10}
.hbar{display:flex;align-items:center;gap:10px;padding:10px 14px;max-width:760px;margin:0 auto}
.logo{font-family:Cinzel,serif;font-weight:900;font-size:19px;letter-spacing:.5px;line-height:1;cursor:pointer;
  background:linear-gradient(90deg,var(--feu),var(--foudre),var(--terre),var(--air),var(--eau));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-size:10px;letter-spacing:4px;color:var(--gold);-webkit-text-fill-color:var(--gold);margin-top:3px}
.lvlbox{flex:1;min-width:0;display:flex;align-items:center;gap:7px;justify-content:center}
.lvlbadge{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px;
  background:radial-gradient(circle at 30% 30%,#7b5cff,#3a238f);border:2px solid var(--gold);flex:none}
.xpwrap{flex:1;max-width:120px;height:7px;background:#ffffff14;border-radius:9px;overflow:hidden}
#xpbar{height:100%;width:0;background:linear-gradient(90deg,#7b5cff,var(--gold));transition:width .5s}
.balance{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);padding:6px 12px 6px 8px;border-radius:30px;font-weight:900;font-size:15px}
.balance.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.12);border-color:var(--gold)}}
.crys{width:18px;height:18px;flex:none}

/* Nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#120e24f5;border-top:1px solid #ffffff12;backdrop-filter:blur(8px);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:760px;margin:0 auto;display:flex}
nav button{flex:1;background:none;padding:9px 0 10px;font-size:11px;font-weight:800;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:21px;filter:grayscale(.7);transition:.2s}
nav button.on{color:var(--gold)}
nav button.on span{filter:none;transform:translateY(-2px)}

/* Generic */
h1,h2,h3{font-family:Cinzel,serif;margin:0}
.panel{background:linear-gradient(180deg,var(--panel),#17122e);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;position:relative}
.btn{background:linear-gradient(180deg,#8a6bff,#5b3fd6);padding:12px 16px;border-radius:12px;font-weight:900;font-size:15px;box-shadow:0 4px 0 #3a2591,0 6px 18px #5b3fd655;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3a2591}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#3a2600;box-shadow:0 4px 0 #a07214,0 6px 18px #f5c45155}
.btn.green{background:linear-gradient(180deg,#5ef0a0,#22b867);color:#06301a;box-shadow:0 4px 0 #157a43}
.btn.red{background:linear-gradient(180deg,#ff7d96,#e0405f);box-shadow:0 4px 0 #8f1f37}
.btn.ghost{background:var(--panel2);box-shadow:0 3px 0 #120d28;border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.big{width:100%;padding:15px;font-size:17px;margin-top:10px}
.row{display:flex;gap:8px}.row>*{flex:1}
.mute{color:var(--mute)}
.center{text-align:center}

.ghead{display:flex;align-items:center;gap:12px;margin-top:14px}
.ghead .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
.ghead h2{font-size:22px}
.ghead p{margin:2px 0 0;color:var(--mute);font-size:13px}
.back{background:var(--panel2);border:1px solid var(--line);width:36px;height:36px;border-radius:10px;font-size:18px;flex:none}

.betrow{display:flex;align-items:center;gap:10px;margin:6px 0}
.betrow label{font-weight:800;font-size:13px;color:var(--mute);min-width:62px}
.betbox{flex:1;display:flex;background:#0f0b20;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.betbox input,.betrow>input,.betrow>select{flex:1;min-width:0;background:#0f0b20;border:1px solid var(--line);color:var(--txt);padding:10px 12px;border-radius:12px;font-weight:800}
.betbox input{border:none;border-radius:0}
.betbox button{background:var(--panel2);padding:0 12px;font-weight:900;border-left:1px solid var(--line);font-size:14px}

#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%;max-width:420px}
.tst{background:#241c46f5;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:800;font-size:14px;animation:tin .25s;box-shadow:0 8px 30px #0008;text-align:center}
.tst.win{border-color:var(--win);color:#c9ffe0}.tst.lose{border-color:var(--lose);color:#ffd0da}.tst.gold{border-color:var(--gold);color:var(--gold2)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}

/* Home */
.hero{margin-top:14px;border-radius:22px;padding:22px 18px;position:relative;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(circle at 85% 20%,#ff6b3d44,transparent 40%),radial-gradient(circle at 10% 90%,#3da5ff44,transparent 45%),radial-gradient(circle at 60% 110%,#5fcf6a33,transparent 40%),linear-gradient(135deg,#2a1d5c,#16102e)}
.hero h1{font-size:28px;line-height:1.1}
.hero h1 b{color:var(--gold)}
.hero p{color:var(--mute);margin:8px 0 14px;font-size:14px;max-width:70%}
.orbs{position:absolute;right:-6px;top:10px;display:grid;grid-template-columns:repeat(2,44px);gap:6px;transform:rotate(8deg)}
.orb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;animation:float 3s ease-in-out infinite}
.orb:nth-child(2){animation-delay:.5s}.orb:nth-child(3){animation-delay:1s}.orb:nth-child(4){animation-delay:1.5s}.orb:nth-child(5){animation-delay:2s}
@keyframes float{50%{transform:translateY(-6px)}}
.daily{display:flex;align-items:center;gap:12px}
.daily .gift{font-size:34px}
.daily .t{flex:1}
.daily .t b{display:block;font-size:15px}
.daily .t span{font-size:12px;color:var(--mute)}
.sec{font-family:Cinzel,serif;font-size:16px;margin:20px 2px 4px;color:var(--gold2);letter-spacing:.5px}
.ggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
@media(min-width:560px){.ggrid{grid-template-columns:repeat(3,1fr)}}
.gcard{border-radius:18px;padding:14px;text-align:left;min-height:118px;position:relative;overflow:hidden;border:1px solid #ffffff1a;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .15s}
.gcard:active{transform:scale(.97)}
.gcard .big{position:absolute;right:-6px;top:-4px;font-size:58px;opacity:.9;filter:drop-shadow(0 6px 10px #0006)}
.gcard b{font-family:Cinzel,serif;font-size:17px;position:relative}
.gcard span{font-size:11.5px;color:#ffffffc0;position:relative;line-height:1.25;margin-top:2px}
.gcard .tag{position:absolute;left:10px;top:10px;font-size:10px;font-weight:900;background:#0006;padding:3px 8px;border-radius:20px;letter-spacing:.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#0f0b20;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--mute)}
footer{text-align:center;color:var(--mute);font-size:11.5px;padding:18px 10px 8px;line-height:1.5}

/* Plinko */
#pc{width:100%;display:block}
.slots{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;margin:0 3.57%}
.slot{font-size:9.5px;font-weight:900;text-align:center;padding:6px 0;border-radius:6px;transition:transform .15s}
.slot.hit{transform:translateY(4px) scale(1.1);filter:brightness(1.5)}
.m0{background:#3a2f6b}.m1{background:#3d6bd6}.m2{background:#2fae8f}.m3{background:#e0a72e;color:#2a1800}.m4{background:#ff6b3d}.m5{background:#ff3d6e}

/* Crash */
.crashwrap{position:relative;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 120%,#2a1d5c,#0f0b20)}
#cc{width:100%;height:170px;display:block}
.crashm{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:44px;font-weight:900;text-shadow:0 4px 20px #000}
.crashm.boom{color:var(--lose)}.crashm.ok{color:var(--win)}
.crashm small{display:block;font-size:13px;font-weight:800;color:var(--mute)}
.hist{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.hist span{font-size:12px;font-weight:900;padding:4px 9px;border-radius:20px;background:#0f0b20;border:1px solid var(--line);flex:none}
.hist .g{color:var(--win)}.hist .r{color:var(--lose)}

/* Mines */
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.tile{aspect-ratio:1;border-radius:12px;background:linear-gradient(180deg,#3a2f6b,#2a2152);box-shadow:0 4px 0 #1a1438;font-size:26px;display:grid;place-items:center;transition:transform .1s}
.tile:active{transform:translateY(2px)}
.tile.safe{background:radial-gradient(circle,#2bd99a55,#123a33);box-shadow:none;animation:pop .3s}
.tile.bomb{background:radial-gradient(circle,#ff5c7a88,#3a1020);box-shadow:none;animation:pop .3s}
.tile.dim{opacity:.45}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.1)}}
.minfo{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px;font-size:14px}
.minfo b{color:var(--gold)}

/* Playing cards */
.hand{display:flex;gap:6px;min-height:92px;align-items:center;flex-wrap:wrap}
.pc{width:60px;height:86px;border-radius:9px;background:linear-gradient(180deg,#fff,#efe9ff);color:#1a1433;font-weight:900;position:relative;box-shadow:0 4px 12px #0007;animation:deal .3s;flex:none}
.pc .r{position:absolute;left:6px;top:4px;font-size:17px;line-height:1}
.pc .s{position:absolute;right:6px;bottom:2px;font-size:24px}
.pc.red{color:#d6284f}
.pc.back{background:repeating-linear-gradient(45deg,#4b33b8 0 6px,#3a268f 6px 12px);border:3px solid #f5c451}
.pc.back::after{content:'✦';position:absolute;inset:0;display:grid;place-items:center;color:var(--gold);font-size:26px}
.pc.big{width:96px;height:136px}.pc.big .r{font-size:28px}.pc.big .s{font-size:40px}
@keyframes deal{from{transform:translateY(-20px) rotate(-8deg);opacity:0}}
.lbl{font-size:12px;font-weight:800;color:var(--mute);margin:6px 0 4px;display:flex;justify-content:space-between}
.lbl b{color:var(--txt);font-size:14px}
.result{text-align:center;font-weight:900;font-size:18px;min-height:26px;margin:6px 0}
.result.w{color:var(--win)}.result.l{color:var(--lose)}

/* Roulette */
.wheelbox{position:relative;width:250px;height:250px;margin:6px auto 4px}
#rw{width:100%;height:100%;border-radius:50%;transition:transform 4.2s cubic-bezier(.12,.6,.1,1)}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid var(--gold);filter:drop-shadow(0 2px 4px #000)}
.rres{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.rres div{width:70px;height:70px;border-radius:50%;background:#0f0b20;border:3px solid var(--gold);display:grid;place-items:center;font-size:26px;font-weight:900}
.chips{display:flex;gap:6px;justify-content:center;margin:6px 0 10px}
.chip{width:44px;height:44px;border-radius:50%;font-size:12px;font-weight:900;border:3px dashed #ffffff88;box-shadow:0 3px 0 #0006}
.chip.on{outline:3px solid var(--gold);outline-offset:2px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.cell{position:relative;padding:9px 0;border-radius:8px;font-weight:900;font-size:14px;text-align:center;border:1px solid #ffffff14}
.cell.rd{background:#c42848}.cell.bk{background:#1d1838}.cell.zr{background:#1f9e5c;grid-column:1/-1}
.cell.out{background:var(--panel2);font-size:12px}
.cell.win{outline:3px solid var(--gold);z-index:1}
.cell .cb{position:absolute;right:-4px;top:-6px;background:var(--gold);color:#3a2600;font-size:10px;border-radius:12px;padding:1px 6px;z-index:2}
.outs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}

/* Dice */
.dicebar{position:relative;height:16px;border-radius:10px;margin:40px 4px 10px;overflow:visible}
.dicebar .lo,.dicebar .hi{position:absolute;top:0;bottom:0}
.dmark{position:absolute;top:-38px;transform:translateX(-50%);transition:left .5s cubic-bezier(.2,.8,.2,1);text-align:center}
.dmark div{background:#fff;color:#1a1433;font-weight:900;border-radius:9px;padding:5px 8px;font-size:15px;box-shadow:0 4px 12px #0008}
.dmark::after{content:'';display:block;margin:0 auto;width:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid #fff}
input[type=range]{width:100%;accent-color:var(--gold);margin:8px 0}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.seg{display:flex;background:#0f0b20;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px;border-radius:9px;background:none;font-weight:900;font-size:13px;color:var(--mute)}
.seg button.on{background:var(--panel2);color:var(--txt)}

/* Creature cards */
.ccard{width:100%;aspect-ratio:5/7;border-radius:14px;position:relative;overflow:hidden;padding:7px;display:flex;flex-direction:column;border:3px solid #ffffff30;box-shadow:0 6px 18px #0008}
.ccard .el{position:absolute;left:6px;top:6px;font-size:13px;background:#0006;border-radius:20px;padding:2px 6px}
.ccard .pw{position:absolute;right:6px;top:6px;font-size:11px;font-weight:900;background:#0006;border-radius:20px;padding:3px 7px}
.ccard .art{flex:1;display:grid;place-items:center;font-size:clamp(34px,11vw,58px);filter:drop-shadow(0 6px 8px #0008)}
.ccard .nm{font-family:Cinzel,serif;font-weight:900;font-size:clamp(10px,2.9vw,14px);text-align:center;text-shadow:0 2px 4px #000;line-height:1.1}
.ccard .rr{text-align:center;font-size:clamp(8px,2.3vw,11px);font-weight:800;opacity:.9;margin-top:2px;letter-spacing:.5px}
.ccard.r1{border-color:#7ec8ff}.ccard.r2{border-color:#c07bff;box-shadow:0 0 18px #c07bff66}
.ccard.r3{border-color:var(--gold);box-shadow:0 0 22px #f5c45188}
.ccard.r4{border-color:#fff;box-shadow:0 0 26px #ffffffaa}
.ccard.gold{border-color:var(--gold2)}
.ccard.gold::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffe39a88 45%,transparent 60%);background-size:250% 100%;animation:shine 2.2s linear infinite;pointer-events:none;mix-blend-mode:screen}
.ccard .gtag{position:absolute;left:50%;transform:translateX(-50%);top:30px;background:linear-gradient(var(--gold2),var(--gold));color:#3a2600;font-size:9px;font-weight:900;padding:2px 7px;border-radius:10px}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
.ccard.locked{background:#120e24!important;border-color:#2c2452;box-shadow:none}
.ccard.locked .art{filter:brightness(0) drop-shadow(0 0 1px #6d5fb0);opacity:.5}
.cback{width:100%;aspect-ratio:5/7;border-radius:14px;border:3px solid var(--gold);background:radial-gradient(circle,#5b3fd6,#1e1450);display:grid;place-items:center;font-size:40px;color:var(--gold);box-shadow:0 6px 18px #0008;cursor:pointer;animation:wob 1.6s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-2deg) scale(1.02)}}
.flip{animation:flip .45s}
@keyframes flip{0%{transform:rotateY(90deg) scale(.8)}100%{transform:none}}
.pack{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:6px}
.pack>*{min-width:0}
@media(min-width:560px){.pack{grid-template-columns:repeat(5,1fr)}}
.boosters{display:grid;gap:10px}
.booster{display:flex;align-items:center;gap:12px;border-radius:16px;padding:12px;border:1px solid #ffffff22}
.booster .bx{width:58px;height:78px;border-radius:10px;display:grid;place-items:center;font-size:28px;flex:none;border:2px solid #ffffff55;box-shadow:0 6px 14px #0007}
.booster .t{flex:1;min-width:0}
.booster .t b{font-family:Cinzel,serif;font-size:16px;display:block}
.booster .t small{font-size:11px;color:#ffffffb0;display:block;line-height:1.35}
.booster .btn{padding:10px 12px;font-size:14px;white-space:nowrap}
.colgrid>*{min-width:0}
.colgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
@media(min-width:560px){.colgrid{grid-template-columns:repeat(5,1fr)}}
.cwrap{position:relative}
.cnt{position:absolute;right:-4px;top:-6px;background:var(--gold);color:#3a2600;font-weight:900;font-size:11px;border-radius:12px;padding:2px 7px;z-index:2}
.evo{width:100%;margin-top:6px;padding:6px;font-size:12px;border-radius:9px}
.prog{height:5px;background:#ffffff14;border-radius:4px;margin-top:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.filters button{flex:none;padding:7px 12px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);font-weight:800;font-size:12.5px}
.filters button.on{background:var(--gold);color:#3a2600;border-color:var(--gold)}
.modal{position:fixed;inset:0;z-index:60;background:#000b;display:grid;place-items:center;padding:20px;animation:tin .2s}
.modal .ccard{width:220px}
.modal .box{text-align:center}

/* Compact game screens */
.ghead{margin-top:10px;gap:10px}.ghead .ico{width:38px;height:38px;font-size:20px;border-radius:11px}.ghead h2{font-size:18px}.ghead p{font-size:12px}
.back{width:32px;height:32px;font-size:16px}
.panel{padding:11px;margin:9px 0;border-radius:15px}
.btn{padding:10px 14px;font-size:14px}.btn.big{padding:11px;font-size:15px;margin-top:8px}
.betrow{margin:4px 0}.betrow label{font-size:12px;min-width:54px}
.betbox input,.betrow>input,.betrow>select{padding:8px 10px}
.betbox button{padding:0 10px;font-size:13px}
.slot{font-size:8px;padding:4px 0}
.crashm{font-size:34px}.crashm small{font-size:12px}
.mgrid{max-width:290px;margin:0 auto;gap:6px}.tile{font-size:20px;border-radius:10px}
.minfo{font-size:13px;margin-bottom:8px}
.hand{min-height:74px;gap:5px}
.pc{width:48px;height:70px;border-radius:7px}.pc .r{font-size:14px;left:5px}.pc .s{font-size:19px;right:5px}
.pc.big{width:76px;height:108px}.pc.big .r{font-size:22px}.pc.big .s{font-size:32px}
.result{font-size:15px;min-height:22px;margin:4px 0}
.wheelbox{width:190px;height:190px}
.rres div{width:54px;height:54px;font-size:20px}
.chip{width:38px;height:38px;font-size:11px}
.cell{padding:6px 0;font-size:12px;border-radius:6px}.cell.out{font-size:11px}
.board,.outs{gap:3px}
.dicebar{margin:34px 4px 8px;height:12px}.dmark{top:-34px}.dmark div{font-size:13px;padding:4px 7px}
.stat{padding:8px}.stat b{font-size:15px}
.seg button{padding:7px;font-size:12px}

.rbon{color:var(--gold)!important;font-weight:800}
.eqrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.eqrow>*{min-width:0}

.clcd{display:grid;grid-template-columns:1.3fr 1fr .8fr 1.3fr;gap:3px;margin-top:5px;background:#05050c;border:2px solid #1a1a2a;border-radius:6px;padding:3px}
.clcd>div{text-align:center;background:linear-gradient(#0c1a3a,#06102a);border-radius:4px;padding:2px 0}
.clcd small{display:block;font-size:7.5px;font-weight:900;color:#ff6b3d;letter-spacing:1px}
.clcd b{font-size:12.5px;color:#ffd23d;font-family:'Courier New',monospace}
.clcd .cw b{color:#7dffa8;font-size:14px}
.cmsg{margin-top:4px;min-height:20px;text-align:center;font-size:11.5px;font-weight:800;color:#1a1a2a;background:linear-gradient(#f2f2f7,#c9c9d4);border-radius:6px;padding:2px 4px}
.cmsg b{color:#0b7a3a}
.cside{width:60px;flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 4px;border-radius:14px;background:linear-gradient(90deg,#6c6c7c,#d9d9e2 50%,#7c7c8c);box-shadow:0 6px 18px #0008}
.cb{width:50px;height:34px;border-radius:8px;background:linear-gradient(180deg,#2a3a8a,#101a4a);color:#9fd0ff;border:1px solid #4a6aff;font-weight:900;font-size:18px;box-shadow:0 0 8px #3d6bffaa,inset 0 1px 0 #ffffff40,0 3px 0 #05081a;flex:none}
.cb.cs{font-size:10px;letter-spacing:.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.cb.cs small{font-size:9px;color:#fff}
.cb.on{background:linear-gradient(180deg,#ffd23d,#c98a1a);color:#3a2600;border-color:#fff3a8;box-shadow:0 0 12px #ffd23d}
.cb:disabled{opacity:.45}
.cbet{width:52px;text-align:center;background:#05050c;border-radius:6px;padding:2px 0;border:1px solid #333}
.cbet small{display:block;font-size:7.5px;font-weight:900;color:#ff6b3d}.cbet b{font-size:12px;color:#ffd23d;font-family:'Courier New',monospace}
.cspin{width:54px;height:54px;border-radius:50%;margin:4px 0;background:radial-gradient(circle at 35% 30%,#a8ffb8,#22c55e 50%,#0b6a2e);border:3px solid #e8ffe8;color:#04260f;font-weight:900;font-size:11px;box-shadow:0 0 16px #22c55eaa,0 4px 0 #064a20}
.cspin:active{transform:translateY(3px)}.cspin:disabled{filter:grayscale(.7)}
.ptsym{width:48px;height:48px;flex:none;display:flex;align-items:center;justify-content:center;background:#fbf6ea;border-radius:8px}
/* compact Colère layout */
.zwrap .zgod{font-size:28px}.zhead{margin-bottom:4px}.zside{gap:4px;padding:6px 4px}.zb{height:32px}.zb.zsm{height:38px}.zspin{width:50px;height:50px}
.zgrid{max-width:340px;margin:0 auto}

/* Cases */
.cslist{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.cscase{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 3px;display:flex;flex-direction:column;align-items:center;gap:2px}
.cscase.on{border-color:var(--gold);box-shadow:0 0 12px #f5c45155}
.csbox{width:44px;height:36px;border-radius:7px;background:var(--g);display:grid;place-items:center;box-shadow:inset 0 0 0 2px #fff6,0 3px 6px #0007}.csbox span{font-size:22px}
.cscase b{font-size:10px;line-height:1.1;text-align:center}.cscase small{font-size:10.5px;font-weight:900;color:#7dffa8}
.csopen{padding:10px 8px}
.csreel{position:relative;height:118px;overflow:hidden;border-radius:10px;background:linear-gradient(180deg,#0a0716,#16102e);border:1px solid var(--line);margin-bottom:6px}
.csreel::before,.csreel::after{content:'';position:absolute;top:0;bottom:0;width:40px;z-index:2;pointer-events:none}
.csreel::before{left:0;background:linear-gradient(90deg,#0a0716,transparent)}.csreel::after{right:0;background:linear-gradient(-90deg,#0a0716,transparent)}
.cstrack{display:flex;gap:6px;padding:9px 0 0 6px;will-change:transform}
.csmark{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--gold);box-shadow:0 0 10px var(--gold);z-index:3}
.csmark::before,.csmark::after{content:'';position:absolute;left:50%;transform:translateX(-50%);border:7px solid transparent}
.csmark::before{top:0;border-top-color:var(--gold)}.csmark::after{bottom:0;border-bottom-color:var(--gold)}
.csi{position:relative;flex:none;width:92px;height:100px;border-radius:8px;overflow:hidden;background:#1b1535;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px #ffffff14}
.csbg{position:absolute;inset:0;opacity:.28}
.csi::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 100%,var(--rc),transparent 65%);opacity:.45}
.cse{position:relative;z-index:1;font-size:36px;filter:drop-shadow(0 3px 4px #000a)}
.csn{position:relative;z-index:1;font-size:10px;font-weight:900;text-align:center;line-height:1.1;margin-top:3px;padding:0 3px}.csn small{display:block;font-size:9px;color:#ffffffb0;font-weight:800}
.csr{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--rc);box-shadow:0 0 8px var(--rc)}
.cst{position:absolute;top:3px;left:3px;z-index:2;font-size:8px;font-weight:900;background:linear-gradient(var(--gold2),var(--gold));color:#3a2600;padding:1px 4px;border-radius:4px}
.csi.or{box-shadow:inset 0 0 0 2px var(--gold)}
.csi.won{animation:won 1s ease-in-out infinite alternate;box-shadow:inset 0 0 0 2px var(--rc),0 0 20px var(--rc)}
@keyframes won{to{transform:scale(1.06)}}
.csctl{display:flex;gap:8px;margin-top:6px}.csctl .seg{flex:1}
.cswon{display:flex;flex-direction:column;gap:6px;margin:8px 0 4px}
.cswin{display:flex;align-items:center;gap:10px;background:#0f0b20;border:1px solid var(--rc);border-radius:12px;padding:6px;animation:tin .3s;box-shadow:0 0 14px color-mix(in srgb,var(--rc) 40%,transparent)}
.cswin .csi{width:70px;height:76px}.cswin .cse{font-size:28px}.cswin .csn{display:none}
.cswi{flex:1;min-width:0}.cswi b{display:block;font-size:13px}.cswi small{display:block;font-size:11px;color:var(--rc);font-weight:900}.cswi em{font-style:normal;font-size:17px;font-weight:900;color:#7dffa8}
.cstot{text-align:center;font-weight:900;font-size:15px;margin:6px 0}.cstot.up{color:var(--win)}.cstot.down{color:var(--lose)}.cstot small{color:var(--mute);font-size:12px}
.csodds{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.csodds span{font-size:11px;font-weight:800;border-left:4px solid var(--rc);background:#0f0b20;padding:3px 7px;border-radius:5px}.csodds b{color:var(--rc)}
.csgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
@media(min-width:520px){.csgrid{grid-template-columns:repeat(4,1fr)}}
.cswrap .csi{width:100%;height:96px}
.csv{text-align:center;font-size:11.5px;font-weight:900;color:#7dffa8;margin-top:3px}.csv small{color:var(--mute);margin-left:4px}

/* Amis & duels */
.frow{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,var(--panel),#17122e);border:1px solid var(--line);border-radius:14px;padding:9px 10px;margin:7px 0}
.fi{flex:1;min-width:0}.fi b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fi small{font-size:11.5px;color:var(--mute);font-weight:700}
.fb{padding:7px 10px;font-size:12px;flex:none}
.ondot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px #22c55e;margin-right:5px;vertical-align:middle}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:12px}
.dpl{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border-radius:14px;border:2px solid transparent;background:var(--panel);min-width:0}
.dpl b{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dpl small{font-size:10.5px;color:var(--mute);font-weight:800}
.dpl.turn{border-color:var(--gold);box-shadow:0 0 16px #f5c45155;animation:glow 1.4s ease-in-out infinite}
.dvs{text-align:center;flex:none}.dvs b{font-family:Cinzel,serif;font-size:24px;color:var(--gold)}.dvs small{display:block;font-size:11px;font-weight:900;color:#7dffa8}
.dstat{text-align:center;font-weight:900;font-size:16px;margin:10px 0 0;padding:8px;border-radius:12px;background:#0f0b20;border:1px solid var(--line)}
.dstat.me{border-color:var(--gold);color:var(--gold2)}.dstat.w{border-color:var(--win);color:#c9ffe0}.dstat.l{border-color:var(--lose);color:#ffd0da}
.tile.myturn{box-shadow:0 4px 0 #1a1438,inset 0 0 0 2px #f5c45155}
.dspin{font-size:40px;animation:spin 2s linear infinite;display:inline-block;margin-bottom:6px}

.jhero{margin-top:14px}.jhero h2{font-size:22px;background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}.jhero p{margin:2px 0 0;color:var(--mute);font-size:13px}
.ggrid2{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:12px}
@media(min-width:560px){.ggrid2{grid-template-columns:repeat(3,1fr)}}
.gc2{position:relative;padding:0;border-radius:20px;overflow:hidden;text-align:left;background:#120e24;display:flex;flex-direction:column;box-shadow:0 0 0 1px #ffffff1c,0 8px 22px #0009;transition:transform .15s;isolation:isolate}
.gc2::before{content:'';position:absolute;inset:0;border-radius:20px;padding:1.5px;background:linear-gradient(160deg,#ffe39a,#ffffff10 40%,#ffffff10 60%,#f5c45188);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;z-index:3;pointer-events:none}
.gc2:active{transform:scale(.97)}
.gc2art{position:relative;height:108px;background:var(--g);overflow:hidden;display:grid;place-items:center}
.gc2art::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,#120e24)}
.gc2rays{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,#ffffff1f 0 8deg,transparent 8deg 22deg);animation:spin 30s linear infinite;opacity:.7}
.gc2halo{position:absolute;width:86px;height:86px;border-radius:50%;background:radial-gradient(circle,#ffffffaa,#ffffff22 45%,transparent 70%);filter:blur(2px)}
.gc2ico{position:relative;z-index:1;font-size:54px;filter:drop-shadow(0 6px 10px #000a);animation:float 3.2s ease-in-out infinite}
.gc2ico2{position:absolute;z-index:1;right:20%;top:16%;font-size:28px;filter:drop-shadow(0 3px 5px #000a);animation:float 2.6s ease-in-out infinite reverse}
.gc2tag{position:absolute;top:8px;left:8px;z-index:2;font-size:9px;font-weight:900;letter-spacing:1px;background:#0009;padding:3px 8px;border-radius:20px;border:1px solid #ffffff2a}
.gc2info{position:relative;z-index:2;padding:4px 11px 11px;display:flex;flex-direction:column;gap:2px;flex:1}
.gc2info b{font-family:Cinzel,serif;font-size:15.5px;line-height:1.15}
.gc2info span{font-size:11.5px;color:#ffffffa8;line-height:1.3}
.gc2info em{font-style:normal;margin-top:auto;padding-top:6px;font-size:10.5px;font-weight:900;color:var(--gold2)}
.gc2shine{position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(115deg,transparent 35%,#ffffff26 48%,transparent 60%);background-size:260% 100%;animation:shine 5s linear infinite}
.gc2:nth-child(2n) .gc2shine{animation-delay:-2.5s}.gc2:nth-child(3n) .gc2ico{animation-delay:-1s}
.modal{background:#000d}
#lvl{font-size:10px;letter-spacing:-.5px;overflow:hidden}

.rlv{display:flex;justify-content:space-between;font-size:10.5px;font-weight:900;color:var(--mute);margin-top:7px}
.rlv span:first-child{color:var(--gold2)}.rlv.max{justify-content:center;color:var(--gold)}

/* Poker vidéo */
.vpt{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;padding:8px 10px;font-size:11.5px;background:linear-gradient(180deg,#1a3a8a,#0f1f50);border-color:#3d6bff}
.vpt div{display:flex;justify-content:space-between;padding:2px 6px;border-radius:5px;color:#ffe39a;font-weight:800}.vpt b{color:#fff}
.vpt div.on{background:#ffd23d;color:#3a2600;animation:glow 1s infinite}.vpt div.on b{color:#3a2600}
.vptable{background:radial-gradient(circle at 50% 0%,#2f6b4a,#123322 75%);border-color:#2f6b4a}
.vprow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.vpw{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.vpc{width:100%;aspect-ratio:5/7;border-radius:8px;background:linear-gradient(180deg,#fff,#efe9ff);color:#1a1433;position:relative;font-weight:900;box-shadow:0 4px 10px #0008;transition:transform .15s}
.vpc.red{color:#d6284f}.vpc .r{position:absolute;left:5px;top:3px;font-size:16px}.vpc .r2{position:absolute;right:5px;bottom:3px;font-size:16px;transform:rotate(180deg)}.vpc .s{position:absolute;inset:0;display:grid;place-items:center;font-size:30px}
.vpc.back{background:repeating-linear-gradient(45deg,#4b33b8 0 6px,#3a268f 6px 12px);border:3px solid #f5c451}
.vpc.held{transform:translateY(-6px);box-shadow:0 0 0 3px var(--gold),0 8px 16px #000a}
.vpc.flipin{animation:flip .35s}
.vph{height:14px;font-size:9.5px;font-weight:900;color:var(--gold);letter-spacing:.5px}
/* Course */
.ctrack{padding:8px;background:repeating-linear-gradient(90deg,#3a7a3a 0 30px,#357035 30px 60px);border-color:#6b4a1f;border-width:3px}
.lane{position:relative;height:46px;border-bottom:2px dashed #ffffff40;display:flex;align-items:center}
.lane:last-child{border-bottom:none}
.lnum{position:absolute;left:0;width:18px;height:18px;border-radius:50%;background:#fff;color:#1a1433;font-size:11px;font-weight:900;display:grid;place-items:center;z-index:2}
.runner{position:absolute;left:18px;font-size:32px;transform:translateX(0);will-change:transform}
.runner span{display:inline-block;transform:scaleX(-1);filter:drop-shadow(0 3px 3px #0008)}
.runner.go span{animation:hop .25s ease-in-out infinite alternate}
@keyframes hop{to{transform:scaleX(-1) translateY(-5px) rotate(4deg)}}
.runner.winr span{animation:won .5s ease-in-out infinite alternate;filter:drop-shadow(0 0 10px #ffd23d)}
.fin{position:absolute;right:4px;top:0;bottom:0;width:8px;background:repeating-linear-gradient(0deg,#fff 0 6px,#111 6px 12px)}
.cpick{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;margin:5px 0;border-radius:12px;background:#0f0b20;border:1px solid var(--line);text-align:left}
.cpick.on{border-color:var(--gold);box-shadow:0 0 12px #f5c45155}
.cpick .cn{width:22px;height:22px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-weight:900;font-size:12px;flex:none}
.cpick .ce{font-size:26px}.cpick .cnm{flex:1;font-weight:800;font-size:13.5px}.cpick .cnm small{display:block;font-size:10.5px;color:var(--mute);letter-spacing:1px}.cpick b{color:var(--gold2);font-size:15px}
/* Roue */
.rfp{padding:8px}
.rfwrap{position:relative;width:min(300px,82vw);aspect-ratio:1;margin:10px auto 4px}
#rfw{width:100%;height:100%;border-radius:50%;transition:transform 5s cubic-bezier(.12,.6,.08,1);box-shadow:0 0 0 6px #6b4a00,0 0 30px #ff8ad155}
.rfptr{position:absolute;left:50%;top:-10px;transform:translateX(-50%);border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid #fff;filter:drop-shadow(0 3px 4px #000)}
.rfhub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe39a,#c98a1a);border:3px solid #fff6c8;display:grid;place-items:center;font-size:28px;box-shadow:0 4px 10px #0008}
.rfbets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rfb{position:relative;padding:9px 4px;border-radius:12px;background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 50%,#000));border:2px solid #ffffff40;box-shadow:0 3px 0 #0007}
.rfb b{font-size:19px;display:block;text-shadow:0 2px 3px #0008}.rfb small{font-size:10px;font-weight:800;opacity:.85}
.rfb .rfa{position:absolute;top:-7px;right:-4px;font-style:normal;background:var(--gold);color:#3a2600;font-size:10px;font-weight:900;padding:1px 6px;border-radius:9px}.rfb .rfa:empty{display:none}
.rfb.win{animation:glow 1s infinite;border-color:#fff}
/* Keno */
.kgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.kn{aspect-ratio:1;border-radius:50%;background:#0f0b20;border:1px solid var(--line);font-weight:900;font-size:12.5px}
.kn.s{background:linear-gradient(180deg,#8a6bff,#5b3fd6);border-color:#b9a6ff}
.kn.d{background:#3a2f6b;color:#ffffff90;animation:pop .3s}
.kn.hit{background:radial-gradient(circle at 35% 30%,#ffe39a,#f5c451 55%,#c98a1a);color:#3a2600;border-color:#fff;animation:pop .3s;box-shadow:0 0 10px #ffd23d}
.kpt{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.kpt div{flex:1;min-width:58px;text-align:center;background:#0f0b20;border:1px solid var(--line);border-radius:9px;padding:4px}
.kpt div small{display:block;font-size:9.5px;color:var(--mute);font-weight:800}.kpt div b{font-size:13px;color:var(--gold2)}
.kpt div.on{border-color:var(--win);background:#14321f}
/* Tour */
.twp{padding:8px;background:linear-gradient(180deg,#2a1560,#120a30)}
.twtop{text-align:center;font-size:40px;line-height:1;filter:drop-shadow(0 0 12px #ffd23d)}.twtop small{display:block;font-size:11px;font-weight:900;color:var(--gold2);margin-top:2px}
.tower{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.twf{display:flex;align-items:center;gap:6px;padding:4px;border-radius:10px;opacity:.55}
.twf.act{opacity:1;background:#f5c45118;box-shadow:inset 0 0 0 1px #f5c45188}.twf.ok{opacity:.9}
.twm{width:58px;flex:none;font-size:11px;font-weight:900;color:var(--gold2);text-align:right}
.twc{flex:1;display:grid;gap:5px}
.twt{height:36px;border-radius:9px;background:linear-gradient(180deg,#4a3a8a,#2a2152);box-shadow:0 3px 0 #120d28;font-size:18px}
.twf.act .twt{background:linear-gradient(180deg,#7b5cff,#4b33b8);animation:glow 1.6s infinite}
.twt.good{background:radial-gradient(circle,#2bd99a,#0b5a3a)}.twt.bad{background:radial-gradient(circle,#ffd23d,#c22a00);animation:pop .3s}
.twt.rev{opacity:.6}
/* Éléments */
.elarena{display:flex;align-items:center;justify-content:space-around;padding:16px 8px}
.elside{text-align:center}.elside small{display:block;font-size:11px;font-weight:900;color:var(--mute);margin-bottom:6px}
.elorb{width:84px;height:84px;border-radius:50%;background:#0f0b20;border:3px solid var(--line);display:grid;place-items:center;font-size:40px;transition:.3s}
.elorb.roll{animation:wob .2s infinite}.elorb.wink{transform:scale(1.15);box-shadow:0 0 24px #ffd23d;border-color:var(--gold)}
.elvs{font-family:Cinzel,serif;font-size:26px;font-weight:900;color:var(--gold)}
.elpick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.elb{border-radius:12px;padding:8px 2px;border:2px solid #ffffff40;box-shadow:0 3px 0 #0007;display:flex;flex-direction:column;align-items:center}
.elb span{font-size:26px;filter:drop-shadow(0 2px 3px #0008)}.elb small{font-size:9.5px;font-weight:900;text-shadow:0 1px 2px #000}
.elb:active{transform:translateY(2px)}
.elrules{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-size:11.5px;font-weight:800;color:var(--mute);margin:10px 0 4px}
.elhist{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.elhist div{display:flex;align-items:center;justify-content:center;gap:12px;background:#0f0b20;border-radius:9px;padding:4px;font-size:22px}
.elhist div small{font-size:11px;font-weight:900;color:var(--mute);width:60px;text-align:center}.elhist div.w small{color:var(--win)}.elhist div.l small{color:var(--lose)}
/* Grattage */
